name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 22.6+ is the floor: the sources are executed directly through
        # type stripping, with no build step.
        node: ["22.x", "24.x"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Luma accepts single-quoted strings, which keeps this one line valid in
      # both bash and PowerShell without any backslash escaping.
      - name: Smoke-test the compiled CLI
        run: node dist/cli.js -e "assert(1 + 2 * 3 == 7, 'precedence'); print('ok')"

  examples:
    name: examples match their snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node scripts/run-examples.ts
