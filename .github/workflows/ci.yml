name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 22.18+ is the floor: type stripping is on by default there, so the
        # sources run directly with no build step.
        node: ["22.x", "24.x"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Luma accepts single-quoted strings, which keeps this one line valid in
      # both bash and PowerShell without any backslash escaping.
      - name: Smoke-test the compiled CLI
        run: node dist/cli.js -e "assert(1 + 2 * 3 == 7, 'precedence'); print('ok')"

  quality:
    name: formatting, docs and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      - name: Every example matches its snapshot
        run: node scripts/run-examples.ts

      - name: Luma sources are formatted
        run: npm run fmt:check

      - name: The diagnostic reference is up to date
        run: |
          node scripts/generate-error-docs.ts --write
          git diff --exit-code -- docs/ERRORS.md \
            || (echo "::error::docs/ERRORS.md is stale — run 'npm run docs'" && exit 1)

      - name: Coverage
        run: |
          npm run coverage 2>&1 | tee coverage.txt
          node - <<'JS'
          const fs = require("node:fs");
          const report = fs.readFileSync("coverage.txt", "utf8");
          const row = report.split("\n").find((line) => line.includes("all files"));
          if (!row) throw new Error("no coverage summary found");

          const [lines, branches, functions] = row
            .split("|")
            .slice(1, 4)
            .map((cell) => Number(cell.trim()));

          console.log(`lines ${lines}%, branches ${branches}%, functions ${functions}%`);
          const floor = 90;
          for (const [name, value] of [["line", lines], ["branch", branches], ["function", functions]]) {
            if (!(value >= floor)) {
              throw new Error(`${name} coverage ${value}% is below the ${floor}% floor`);
            }
          }
          JS
